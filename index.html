<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7d84a">
  <meta name="description" content="3択で楽しむ、うんちくエウレーカクイズ。初級・中級・上級・プロの4段階。">
  <title>うんちくエウレーカクイズ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
:root {
  --ink: #252525;
  --paper: #fffdf5;
  --yellow: #f7d84a;
  --yellow-deep: #e8bf22;
  --green: #4f9f69;
  --green-deep: #34764a;
  --cream: #fff5c7;
  --orange: #ee8b3d;
  --red: #cf5148;
  --blue: #4f83b8;
  --purple: #6c5b9b;
  --line: #252525;
  --shadow: 4px 4px 0 rgba(37, 37, 37, .95);
  --radius: 14px;
}

* { box-sizing: border-box; }

html {
  background: #f5edcc;
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 12px 12px, rgba(40,40,40,.045) 1.3px, transparent 1.5px) 0 0 / 22px 22px,
    #f7f0d3;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; }

button:focus-visible {
  outline: 4px solid rgba(79, 131, 184, .45);
  outline-offset: 3px;
}

.page-shell {
  width: min(100%, 680px);
  min-height: 100vh;
  margin: 0 auto;
  background: var(--paper);
  border-inline: 2px solid var(--ink);
}

.site-header {
  padding: calc(env(safe-area-inset-top) + 18px) 18px 14px;
  background: var(--yellow);
  border-bottom: 3px solid var(--ink);
}

.logo-button {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: 9px;
  width: 100%;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.logo-kicker {
  writing-mode: vertical-rl;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
}

.logo-main {
  font-size: clamp(30px, 8vw, 48px);
  font-weight: 1000;
  line-height: .92;
  letter-spacing: -.04em;
}

.logo-sub {
  align-self: center;
  padding: 5px 7px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: white;
  font-weight: 900;
  transform: rotate(-4deg);
}

.app {
  min-height: 72vh;
  padding: 24px 18px 48px;
}

.hero-card,
.about-card,
.install-card,
.question-card,
.answer-title-card,
.answer-card,
.result-card {
  border: 3px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: #fff;
}

.hero-card {
  position: relative;
  overflow: hidden;
  padding: 28px 22px;
  background: var(--cream);
}

.hero-card h1,
.result-card h1,
.answer-title-card h1 {
  margin: 0 0 12px;
  font-size: 34px;
  line-height: 1.1;
}

.hero-card p {
  margin: 5px 0;
  font-weight: 700;
  line-height: 1.7;
}

.burst {
  position: absolute;
  right: -12px;
  top: -24px;
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  font-size: 70px;
  font-weight: 1000;
  transform: rotate(9deg);
}

.level-section {
  margin-top: 34px;
}

.level-section h2,
.about-card h2,
.install-card h2 {
  margin: 0 0 14px;
  font-size: 23px;
}

.level-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.level-card {
  min-height: 112px;
  padding: 16px 10px;
  border: 3px solid var(--ink);
  border-radius: 13px;
  box-shadow: 3px 3px 0 var(--ink);
  color: var(--ink);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}

.level-card:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--ink);
}

.level-beginner { background: #d8efad; }
.level-intermediate { background: #bfe2f1; }
.level-advanced { background: #ffd2a8; }
.level-pro { background: #ddc9ee; }

.level-name {
  display: block;
  font-size: 27px;
  font-weight: 1000;
}

.level-desc {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 800;
}

.about-card,
.install-card {
  margin-top: 34px;
  padding: 24px 20px;
}

.about-card p,
.install-card p {
  margin: 10px 0 0;
  line-height: 1.85;
}

.quiz-topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.level-badge {
  padding: 6px 12px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--yellow);
  font-size: 14px;
  font-weight: 900;
}

.progress-text {
  font-weight: 900;
}

.question-card {
  padding: 24px 18px 22px;
}

.question-card h1 {
  display: inline-block;
  margin: 0 0 14px;
  padding-bottom: 5px;
  border-bottom: 6px solid var(--yellow);
  font-size: 29px;
}

.category-text {
  margin: 0 0 10px;
  color: #666;
  font-size: 13px;
  font-weight: 800;
}

.question-text {
  min-height: 88px;
  margin: 5px 0 20px;
  font-size: clamp(20px, 5.4vw, 27px);
  font-weight: 900;
  line-height: 1.55;
}

.choices {
  display: grid;
  gap: 12px;
}

.choice-button {
  display: grid;
  grid-template-columns: 38px 1fr;
  align-items: center;
  width: 100%;
  min-height: 64px;
  padding: 10px 12px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  box-shadow: 3px 3px 0 var(--ink);
  background: white;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.choice-button:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}

.choice-letter {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  font-weight: 1000;
}

.choice-text {
  padding-left: 5px;
  font-weight: 850;
  line-height: 1.45;
}

.hint-button {
  display: block;
  margin: 22px auto 0;
  padding: 9px 18px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #f0f0f0;
  font-weight: 900;
  cursor: pointer;
}

.hint-box {
  margin-top: 13px;
  padding: 14px;
  border: 2px dashed var(--ink);
  border-radius: 12px;
  background: #fffbe7;
  line-height: 1.65;
}

.answer-title-card {
  padding: 22px 18px 16px;
  background: var(--cream);
}

.judge-text {
  margin: 0;
  font-size: 21px;
  font-weight: 1000;
}

.judge-correct { color: #27854a; }
.judge-wrong { color: var(--red); }

.answer-card {
  margin-top: 18px;
  padding: 22px 18px;
}

.answer-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 17px;
}

.qa-block,
.trivia-block {
  margin-top: 22px;
}

.qa-block h2,
.trivia-block h2 {
  display: inline-block;
  margin: 0 0 8px;
  padding: 4px 10px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: var(--yellow);
  font-size: 16px;
}

.trivia-block h2 {
  background: #d8efad;
}

.qa-block p,
.trivia-block p {
  margin: 0;
  line-height: 1.78;
}

.source-text {
  margin-top: 20px;
  color: #747474;
  font-size: 12px;
  line-height: 1.5;
}

.primary-button,
.secondary-button {
  display: block;
  width: 100%;
  min-height: 56px;
  margin-top: 22px;
  padding: 12px 16px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  box-shadow: 3px 3px 0 var(--ink);
  font-weight: 1000;
  cursor: pointer;
}

.primary-button {
  background: var(--yellow);
}

.secondary-button {
  background: white;
}

.primary-button:active,
.secondary-button:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}

.result-card {
  padding: 28px 20px;
  text-align: center;
  background: var(--cream);
}

.score-display {
  margin: 18px 0;
  font-weight: 1000;
}

#scoreValue {
  font-size: 82px;
  line-height: 1;
}

.score-total {
  font-size: 28px;
}

.result-message {
  min-height: 52px;
  font-weight: 800;
  line-height: 1.65;
}

.site-footer {
  padding: 28px 18px calc(env(safe-area-inset-bottom) + 28px);
  border-top: 3px solid var(--ink);
  background: var(--green);
  color: white;
  text-align: center;
  font-weight: 900;
}

.site-footer p { margin: 0; }
.footer-small { margin-top: 4px !important; font-size: 11px; opacity: .9; }

@media (max-width: 420px) {
  .page-shell { border-inline: 0; }
  .site-header { padding-inline: 14px; }
  .app { padding-inline: 14px; }
  .level-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .level-card { min-height: 100px; }
  .level-name { font-size: 23px; }
}

.hint-line {
  margin: 0 0 8px;
  line-height: 1.65;
  font-weight: 700;
}
.hint-line:last-child { margin-bottom: 0; }
.hint-button:disabled {
  opacity: .6;
  cursor: default;
}


/* ===== 3つのヒントを常時表示 ===== */
.hint-area {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 2px dashed var(--ink);
}

.hint-heading {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 1000;
  text-align: center;
}

.hint-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.hint-button {
  display: block;
  width: 100%;
  min-height: 46px;
  margin: 0;
  padding: 8px 6px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  box-shadow: 2px 2px 0 var(--ink);
  background: #fff;
  color: var(--ink);
  font-size: 14px;
  font-weight: 1000;
  cursor: pointer;
}

.hint-button:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.hint-button.is-open {
  background: var(--yellow);
}

.hint-panels {
  display: grid;
  gap: 8px;
  margin-top: 11px;
}

.hint-box {
  margin: 0;
  padding: 13px 14px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: #fffbe7;
  line-height: 1.65;
  font-weight: 700;
}

.hint-box::before {
  font-weight: 1000;
}

/* ===== 結果：3問以上でエウレーカ ===== */
.eureka-result {
  position: relative;
  margin: 8px auto 22px;
  padding: 20px 14px;
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: #fff;
  box-shadow: 3px 3px 0 var(--ink);
}

.eureka-result.is-pass {
  background: var(--yellow);
}

.eureka-result.is-fail {
  background: #f4f1e8;
}

.eureka-burst,
.retry-mark {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin: 0 auto 6px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: #fff;
  font-size: 34px;
  font-weight: 1000;
  transform: rotate(-8deg);
}

.eureka-word,
.retry-word {
  font-size: clamp(32px, 9vw, 52px);
  font-weight: 1000;
  line-height: 1.05;
  letter-spacing: -.04em;
}

.eureka-word {
  transform: rotate(-2deg);
}

.eureka-pass,
.eureka-fail {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 13px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  font-size: 15px;
  font-weight: 1000;
}

@media (max-width: 360px) {
  .hint-buttons {
    gap: 6px;
  }
  .hint-button {
    font-size: 12px;
    padding-inline: 3px;
  }
}


/* ===== 常時表示の設定ボタン ===== */
.settings-lead { margin: 0 0 14px; font-size: 14px; font-weight: 700; }
.settings-note { margin: 14px 2px 0; color: #666; font-size: 11px; }

.mode-copy strong,.mode-copy small { display: block; }
.mode-copy strong { font-size: 17px; font-weight: 1000; }
.mode-copy small { margin-top: 3px; font-size: 12px; font-weight: 700; line-height: 1.4; }

body.modal-open { overflow: hidden; }

ruby { ruby-position: over; ruby-align: center; }
rt { font-size: .52em; font-weight: 750; line-height: 1.1; }

.reading-transforming { opacity: .72; transition: opacity .12s ease; }

@media (max-width: 420px) {
  .site-header { padding-right: 66px; }
}



/* ===== utility / favorites / dictionary ===== */
.home-utility-row { margin-top: 22px; }
.utility-button { margin-top: 0; }
.card-header-row, .answer-title-row, .dictionary-toprow {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.favorite-button {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 2px solid var(--ink);
  border-radius: 12px;
  box-shadow: 2px 2px 0 var(--ink);
  background: #fff;
  color: var(--ink);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}
.favorite-button.big { width: 50px; height: 50px; font-size: 30px; }
.favorite-button.is-favorite { background: #fff2a0; }
.favorite-button:active { transform: translate(2px,2px); box-shadow: none; }

.visual-card-wrap {
  margin: 6px 0 18px;
  border: 3px solid var(--ink);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 3px 3px 0 var(--ink);
  background: #f0f0f0;
}
.visual-card-wrap.compact { margin-top: 0; }
.topic-visual {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #ececec;
}
.dictionary-item .topic-visual { aspect-ratio: 16 / 7; margin-bottom: 14px; }

.dictionary-head-card, .dictionary-item, .empty-dictionary-card {
  border: 3px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: #fff;
}
.dictionary-head-card {
  padding: 24px 20px;
  background: var(--cream);
}
.dictionary-head-card h1 { margin: 0 0 10px; font-size: 32px; }
.dictionary-lead { margin: 0; font-weight: 700; line-height: 1.7; }
.dictionary-list { display: grid; gap: 16px; margin-top: 20px; }
.dictionary-item, .empty-dictionary-card { padding: 18px 16px; }
.dictionary-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.dictionary-question { margin: 0 0 10px; font-size: 24px; line-height: 1.45; }
.dictionary-answerline { margin: 8px 0 0; line-height: 1.7; }
.dictionary-answerline strong { font-size: 18px; }
.dictionary-note { margin: 14px 0 0; line-height: 1.75; }
.dictionary-source { margin: 12px 0 0; color: #666; font-size: 12px; line-height: 1.5; }
.empty-dictionary-card p { margin: 0; line-height: 1.75; }

.hint-panels { display: block; margin-top: 11px; }
.hint-box { margin: 0; }
.hint-button.is-open { background: var(--yellow); }

@media (max-width: 420px) {
  .dictionary-question { font-size: 21px; }
}


/* ===== Wikipedia / Wikimedia representative photos ===== */
.visual-card-wrap {
  position: relative;
  background: #eee;
}
.topic-visual {
  object-fit: cover;
  min-height: 190px;
}
.visual-source {
  padding: 7px 10px;
  border-top: 2px solid var(--ink);
  background: rgba(255,255,255,.94);
  color: #555;
  font-size: 11px;
  line-height: 1.45;
  text-align: right;
}
.visual-source a {
  color: inherit;
  text-decoration: underline;
}

/* ===== v8 game expansion ===== */
.feature-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:22px 0 10px; }
.feature-card { min-height:118px; padding:14px 10px; border:3px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink); background:#fff; color:var(--ink); cursor:pointer; text-align:center; }
.feature-card:active { transform:translate(3px,3px); box-shadow:none; }
.feature-card strong,.feature-card small { display:block; }
.feature-card strong { margin-top:5px; font-size:17px; font-weight:1000; }
.feature-card small { margin-top:6px; line-height:1.35; font-weight:700; }
.feature-icon { display:block; font-size:32px; }
.daily-feature { background:#fff5b5; }
.section-help { margin:-4px 0 14px; font-size:13px; font-weight:700; line-height:1.6; }

.mode-select-card,.streak-result-card { border:3px solid var(--ink); border-radius:18px; box-shadow:var(--shadow); background:var(--cream); padding:22px 16px; }
.mode-select-card h1,.streak-result-card h1 { margin:0 0 18px; text-align:center; }
.mode-choice-grid { display:grid; gap:14px; }
.mode-choice { width:100%; padding:18px 15px; border:3px solid var(--ink); border-radius:16px; box-shadow:3px 3px 0 var(--ink); color:var(--ink); text-align:left; cursor:pointer; }
.mode-choice strong,.mode-choice small,.mode-choice em { display:block; }
.mode-choice strong { margin-top:8px; font-size:24px; font-weight:1000; }
.mode-choice small { margin-top:6px; line-height:1.5; font-weight:700; }
.mode-choice em { margin-top:10px; font-style:normal; font-size:13px; font-weight:1000; }
.mode-choice-icon { font-size:38px; font-weight:1000; }
.normal-choice { background:#fff; }
.streak-choice { background:linear-gradient(135deg,#fff0ad,#ffcb78); }

.category-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:18px 0; }
.category-card { padding:15px 8px; min-height:128px; border:3px solid var(--ink); border-radius:15px; box-shadow:3px 3px 0 var(--ink); background:#fff; color:var(--ink); cursor:pointer; }
.category-card strong,.category-card small { display:block; }
.category-card strong { margin-top:7px; font-size:17px; }
.category-card small { margin-top:5px; }
.category-icon { display:block; font-size:36px; }

.rare-badge,.rare-mini { display:inline-block; margin-top:5px; padding:4px 9px; border:2px solid var(--ink); border-radius:999px; background:linear-gradient(90deg,#fff3a6,#ffd36a); font-size:12px; font-weight:1000; }
.rare-question-card { box-shadow:0 0 0 4px #ffd54a, 5px 5px 0 var(--ink); animation:rareGlow 1.8s ease-in-out infinite alternate; }
@keyframes rareGlow { from { filter:drop-shadow(0 0 0 rgba(255,205,50,0)); } to { filter:drop-shadow(0 0 10px rgba(255,205,50,.9)); } }

.answer-action-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
.answer-action,.mini-action { border:2px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink); background:#fff; color:var(--ink); font-weight:1000; cursor:pointer; padding:11px 8px; }
.unknown-action.is-active,.unknown-mini.is-active { background:#fff3a4; }
.mega-trivia { border:3px solid var(--ink) !important; background:linear-gradient(135deg,#fff6ad,#ffe47b) !important; box-shadow:4px 4px 0 var(--ink); transform:rotate(-.2deg); }
.mega-trivia h2 { font-size:24px; }

.prediction-block { margin:18px 0; padding:15px; border:2px dashed var(--ink); border-radius:12px; background:#faf8ef; }
.prediction-block h2 { margin:0 0 3px; font-size:18px; }
.prediction-note { margin:0 0 12px; font-size:11px; color:#666; font-weight:700; }
.prediction-row { display:grid; grid-template-columns:24px 1fr 42px; align-items:center; gap:7px; margin:8px 0; }
.prediction-letter { font-weight:1000; }
.prediction-track { height:14px; overflow:hidden; border:2px solid var(--ink); border-radius:999px; background:#fff; }
.prediction-fill { height:100%; background:var(--yellow); }

.dictionary-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:15px; }
.dictionary-tab { padding:10px 7px; border:2px solid var(--ink); border-radius:10px; background:#fff; font-weight:1000; cursor:pointer; }
.dictionary-tab.is-active { background:var(--yellow); }
.dictionary-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.dictionary-trivia-box { margin-top:14px; padding:12px; border:2px solid var(--ink); border-radius:10px; background:#fff7b5; }
.dictionary-trivia-box p { margin:6px 0 0; line-height:1.7; }

.titles-grid { display:grid; gap:12px; margin:18px 0; }
.title-card { display:grid; grid-template-columns:48px 1fr; column-gap:10px; padding:14px; border:3px solid var(--ink); border-radius:13px; box-shadow:2px 2px 0 var(--ink); background:#fff; }
.title-card strong,.title-card small { grid-column:2; }
.title-card strong { font-size:18px; }
.title-card small { margin-top:4px; line-height:1.45; }
.title-icon { grid-row:1 / span 2; display:grid; place-items:center; font-size:32px; }
.title-card.is-locked { opacity:.48; filter:grayscale(1); }
.title-card.is-unlocked { background:#fff6bd; }
.result-unlocks { display:grid; gap:6px; margin:15px 0; padding:12px; border:3px solid var(--ink); border-radius:12px; background:#fff1a8; }
.result-unlocks span { font-weight:900; }
.result-mode-text { margin:0 0 4px; font-weight:1000; }

.streak-hud { margin:0 auto 15px; width:max-content; max-width:100%; padding:8px 14px; border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink); font-weight:1000; background:#fff; }
.streak-hud-number { margin-right:4px; font-size:25px; }
.streak-celebration,.streak-final-display { margin:0 0 16px; padding:18px 12px; border:4px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink); text-align:center; background:#fff; }
.streak-celebration strong,.streak-celebration span,.streak-final-display strong,.streak-final-display span { display:block; }
.streak-big-number,.streak-final-number { font-size:clamp(64px,20vw,118px); line-height:.9; font-weight:1000; }
.streak-celebration strong,.streak-final-display strong { margin-top:8px; font-size:25px; }
.streak-failed { background:#f2eee3; }
.streak-final-level { text-align:center; font-weight:1000; }

.streak-tier-1 { background:#fff; }
.streak-tier-2 { background:linear-gradient(135deg,#e6ffd6,#aeea8e); color:#235b23; }
.streak-tier-3 { background:linear-gradient(135deg,#d8efff,#79c8ff); color:#004d8b; box-shadow:0 0 20px rgba(45,151,255,.6),5px 5px 0 var(--ink); }
.streak-tier-4 { background:linear-gradient(135deg,#fff7a8,#ffbd37); color:#7b4800; animation:goldPulse 1s ease-in-out infinite alternate; }
.streak-tier-5 { background:linear-gradient(120deg,#ff8c8c,#ffe769,#8effa0,#76d7ff,#bb8cff,#ff8cce); background-size:300% 300%; animation:rainbowShift 1.5s linear infinite, megaPulse .8s ease-in-out infinite alternate; color:#252525; box-shadow:0 0 28px rgba(255,98,218,.8),5px 5px 0 var(--ink); }
@keyframes goldPulse { from { transform:scale(1); box-shadow:0 0 5px #ffd04c,5px 5px 0 var(--ink); } to { transform:scale(1.025); box-shadow:0 0 25px #ffad00,5px 5px 0 var(--ink); } }
@keyframes rainbowShift { 0% { background-position:0% 50%; } 100% { background-position:100% 50%; } }
@keyframes megaPulse { from { transform:scale(1); } to { transform:scale(1.035) rotate(.3deg); } }

@media (max-width:420px) {
  .feature-grid,.category-grid { grid-template-columns:1fr 1fr; gap:8px; }
  .feature-card { min-height:108px; }
  .answer-action-grid,.dictionary-actions { grid-template-columns:1fr; }
}

  function tone(freq, start, duration, volume = 0.035, type = "sine") {
    const ctx = getAudioContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + duration + 0.02);
  }

  function uniqueStrings(values) {
    const out = [];
    const seen = new Set();
    for (const value of values) {
      const clean = String(value || "").replace(/\s+/g, " ").trim();
      if (!clean || clean.length < 2 || seen.has(clean)) continue;
      seen.add(clean);
      out.push(clean);
    }
    return out;
  }

  function getWikipediaSearchQueries(question) {
    const text = question.question || "";
    const explanation = question.explanation || "";
    const correct = question.choices?.[question.answer] || "";

    const quoted = [...text.matchAll(/[「『](.{2,32}?)[」』]/g)].map(m => m[1]);
    const katakana = [...text.matchAll(/[ァ-ヴー]{3,}/g)]
      .map(m => m[0])
      .sort((a, b) => b.length - a.length);
    const latin = [...text.matchAll(/[A-Za-z][A-Za-z0-9&.'’\- ]{2,36}/g)]
      .map(m => m[0].trim())
      .sort((a, b) => b.length - a.length);
    const subjectMatch = text.match(/^(.{2,34}?)(?:には|では|とは|は|が)/);
    const subject = subjectMatch ? subjectMatch[1].replace(/[、。！？!?].*$/u, "").trim() : "";

    return uniqueStrings([
      ...quoted,
      ...katakana.slice(0, 3),
      ...latin.slice(0, 2),
      subject,
      `${question.category} ${text.slice(0, 70)}`,
      `${text.slice(0, 90)} ${correct}`,
      `${question.category} ${explanation.slice(0, 80)}`
    ]).slice(0, 6);
  }

  async function fetchWikipediaPageImage(query) {
    const params = new URLSearchParams({
      action: "query",
      generator: "search",
      gsrsearch: query,
      gsrnamespace: "0",
      gsrlimit: "6",
      prop: "pageimages",
      piprop: "thumbnail|name",
      pithumbsize: "960",
      pilicense: "free",
      format: "json",
      origin: "*"
    });

    const response = await fetch(`${WIKI_API}?${params.toString()}`);
    if (!response.ok) throw new Error(`Wikipedia API ${response.status}`);
    const data = await response.json();
    const pages = Object.values(data.query?.pages || {})
      .sort((a, b) => (a.index ?? 9999) - (b.index ?? 9999));
    const page = pages.find(p => p.thumbnail?.source);
    if (!page) return null;

    return {
      url: page.thumbnail.source.replace(/^http:/, "https:"),
      title: page.title,
      sourceLabel: `Wikipedia「${page.title}」`,
      pageUrl: `https://ja.wikipedia.org/wiki/${encodeURIComponent(page.title.replaceAll(" ", "_"))}`
    };
  }

  async function fetchCommonsImage(query) {
    const params = new URLSearchParams({
      action: "query",
      generator: "search",
      gsrsearch: query,
      gsrnamespace: "6",
      gsrlimit: "8",
      prop: "imageinfo",
      iiprop: "url",
      iiurlwidth: "960",
      format: "json",
      origin: "*"
    });

    const response = await fetch(`${COMMONS_API}?${params.toString()}`);
    if (!response.ok) throw new Error(`Commons API ${response.status}`);
    const data = await response.json();
    const pages = Object.values(data.query?.pages || {})
      .sort((a, b) => (a.index ?? 9999) - (b.index ?? 9999));
    const page = pages.find(p => p.imageinfo?.[0]?.thumburl || p.imageinfo?.[0]?.url);

    const info = page.imageinfo[0];

  async function resolveRepresentativeImage(question) {

    const queries = getWikipediaSearchQueries(question);

    for (const query of queries) {

          saveWikiImageCache();
          return result;

        console.warn("Wikipedia image lookup failed:", query, error);
      }

    for (const query of queries.slice(0, 3)) {

        const result = await fetchCommonsImage(query);

          saveWikiImageCache();
          return result;
        }
      } catch (error) {

    sourceEl.replaceChildren();
    const link = document.createElement("a");
    link.href = result.pageUrl;

    { id: "streak10", icon: "🔥", name: "10連続エウレーカ", desc: "連続エウレーカで10問連続正解", test: () => Math.max(...Object.values(stats.streakBest)) >= 10 },
    { id: "streak20", icon: "🌈", name: "虹色エウレーカ", desc: "連続エウレーカで20問連続正解", test: () => Math.max(...Object.values(stats.streakBest)) >= 20 },
    { id: "rare5", icon: "✨", name: "レアうんちくハンター", desc: "超エウレーカ問題を5問正解", test: () => stats.rareCorrect >= 5 },
    { id: "categories5", icon: "🧭", name: "ジャンル探検家", desc: "5種類のカテゴリで遊ぶ", test: () => stats.categoriesPlayed.length >= 5 }
  ];

  function hashString(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function seededRandom(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function seededShuffle(array, seedText) {
    const copy = [...array];
    const rnd = seededRandom(hashString(seedText));
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function dailyQuestions() {
    const key = todayKey();
    const picks = [];
    for (const level of ["beginner","intermediate","advanced","pro"]) {
      const pool = getQuestionsForLevel(level);
      picks.push(seededShuffle(pool, `${key}-${level}`)[0]);
    }
    const used = new Set(picks.map(q => q.id));
    const rest = window.QUIZ_QUESTIONS.filter(q => !used.has(q.id));
    picks.push(seededShuffle(rest, `${key}-bonus`)[0]);
    return seededShuffle(picks, `${key}-order`);
  }

  function isRareQuestion(question) {
    return hashString(question.id + "rare") % 10 === 0;
  }

  function getPrediction(question) {
    const rnd = seededRandom(hashString(question.id + "prediction"));
    const raw = [0.2 + rnd()*0.5, 0.2 + rnd()*0.5, 0.2 + rnd()*0.5];
    const sum = raw.reduce((a,b)=>a+b,0);
    let values = raw.map(v => Math.round(v/sum*100));
    const diff = 100 - values.reduce((a,b)=>a+b,0);
    values[question.answer] += diff;
    return values;
  }

  function toggleUnknown(id) {
    if (unknownIds.includes(id)) {
      unknownIds = unknownIds.filter(x => x !== id);
      showStatus("「知らなかった！」から外しました");
    } else {
      unknownIds = [id, ...unknownIds.filter(x => x !== id)];

    saveUnknownIds(unknownIds);

    button.setAttribute("aria-pressed", active ? "true" : "false");

    updateUnknownButton(button, id);

    });

  function refreshAchievements() {
    const newly = [];
    for (const a of ACHIEVEMENTS) {
      if (a.test() && !stats.unlocked.includes(a.id)) {
        stats.unlocked.push(a.id);
        newly.push(a);
      }
    }
    if (newly.length) {
      state.pendingUnlocks = [...(state.pendingUnlocks || []), ...newly.map(a => a.id)];
      showStatus(`🏆 称号獲得：${newly[0].name}`, false, 3600);
    }
    saveStats();
    return newly;
  }

  async function shareQuestion(question) {
    const text = `【うんちくエウレーカ】\n${question.question}\n答え：${question.choices[question.answer]}\n${question.trivia}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: "うんちくエウレーカ", text });
        return;
      }
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        showStatus("雑学をコピーしました");
        return;
      }
    } catch (error) {
      if (error?.name === "AbortError") return;
    }
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    showStatus("雑学をコピーしました");
  }

  function addRareDecor(question) {
    if (!isRareQuestion(question)) return;
    const card = document.querySelector(".question-card");
    if (card) card.classList.add("rare-question-card");
    const target = document.getElementById("rareBadge");
    if (target) {
      target.hidden = false;
      target.textContent = "✨ 超エウレーカ問題！";
    }
  }

  function streakTier(n) {
    if (n >= 20) return 5;
    if (n >= 10) return 4;
    if (n >= 5) return 3;
    if (n >= 3) return 2;
    return 1;
  }

  function getNextStreakQuestion() {
    state.index += 1;
    if (state.index >= state.questions.length) {
      state.questions = shuffle(getQuestionsForLevel(state.level));
      state.index = 0;
    }
    state.selected = null;
    state.activeHintIndex = null;
    state.usedHintCurrent = false;
    showQuestion();
  }

  function startGame(level, mode = "normal") {
    const pool = getQuestionsForLevel(level);
    state = {
      view: "question", mode, level, categoryGroup: null,
      questions: shuffle(pool), index: 0, score: 0, selected: null,
      activeHintIndex: null, usedHintCurrent: false, hintsUsedTotal: 0,
      streak: 0, streakEnded: false, dictionaryKind: "favorite", pendingUnlocks: [], resultFinalized: false
    };
    if (mode === "normal") state.questions = state.questions.slice(0, QUESTIONS_PER_GAME);
    showQuestion();
  }

  function startDaily() {
    state = {
      view: "question", mode: "daily", level: "daily", categoryGroup: null,
      questions: dailyQuestions(), index: 0, score: 0, selected: null,
      activeHintIndex: null, usedHintCurrent: false, hintsUsedTotal: 0,
      streak: 0, streakEnded: false, dictionaryKind: "favorite", pendingUnlocks: [], resultFinalized: false
    };
    showQuestion();
  }

  function showCategories() {
    state.view = "categories";
    app.replaceChildren(cloneTemplate(categoriesTemplate));
    const grid = document.getElementById("categoryGrid");
    for (const [key, group] of Object.entries(CATEGORY_GROUPS)) {
      const pool = window.QUIZ_QUESTIONS.filter(group.match);
      if (pool.length < 5) continue;
      const button = document.createElement("button");
      button.className = "category-card";
      button.type = "button";
      button.innerHTML = `<span class="category-icon" data-no-reading="true">${group.icon}</span><strong>${group.name}</strong><small>${pool.length}問</small>`;

      grid.appendChild(button);
    }

  function startCategory(key) {
    const group = CATEGORY_GROUPS[key];
    const pool = window.QUIZ_QUESTIONS.filter(group.match);
    state = {
      view: "question", mode: "category", level: "category", categoryGroup: key,
      questions: shuffle(pool).slice(0, QUESTIONS_PER_GAME), index: 0, score: 0, selected: null,
      activeHintIndex: null, usedHintCurrent: false, hintsUsedTotal: 0,
      streak: 0, streakEnded: false, dictionaryKind: "favorite", pendingUnlocks: [], resultFinalized: false
    };
    if (!stats.categoriesPlayed.includes(key)) stats.categoriesPlayed.push(key);
    saveStats();
    refreshAchievements();
    showQuestion();
  }

  function currentModeLabel() {
    if (state.mode === "daily") return "今日の5問";
    if (state.mode === "category") return CATEGORY_GROUPS[state.categoryGroup]?.name || "カテゴリ";
    if (state.mode === "streak") return `${LEVELS[state.level].name}｜連続エウレーカ`;
    return `${LEVELS[state.level].name}｜${LEVELS[state.level].desc}`;
  }

  function showQuestion() {
    state.view = "question";
    const question = state.questions[state.index];
    app.replaceChildren(cloneTemplate(quizTemplate));
    document.getElementById("levelBadge").textContent = currentModeLabel();
    document.getElementById("progressText").textContent = state.mode === "streak" ? `現在 ${state.streak}問連続` : `${state.index + 1} / ${QUESTIONS_PER_GAME}`;
    document.getElementById("questionNumber").textContent = state.mode === "streak" ? `第${state.streak + 1}問` : `${state.index + 1}問目`;
    document.getElementById("categoryText").textContent = `ジャンル：${question.category}`;
    document.getElementById("questionText").innerHTML = question.questionHtml || question.question;
    addRareDecor(question);

    if (state.mode === "streak") {
      const hud = document.getElementById("streakHud");
      hud.hidden = false;
      hud.className = `streak-hud streak-tier-${streakTier(state.streak)}`;
      hud.innerHTML = `<span class="streak-hud-number" data-no-reading="true">${state.streak}</span><span>問連続中</span>`;
    }

    attachVisual(document.getElementById("questionVisual"), question);
    bindFavoriteButton(document.getElementById("questionFavoriteButton"), question.id);

    const choices = document.getElementById("choices");
    const letters = ["A", "B", "C"];
    question.choices.forEach((choice, choiceIndex) => {
      const button = document.createElement("button");
      button.className = "choice-button";
      button.type = "button";
      button.innerHTML = `<span class="choice-letter" data-no-reading="true">${letters[choiceIndex]}</span><span class="choice-text"></span>`;
      button.querySelector(".choice-text").innerHTML = question.choicesHtml?.[choiceIndex] || choice;
      button.addEventListener("click", () => answerQuestion(choiceIndex));
      choices.appendChild(button);
    });

    const hintButtons = [...document.querySelectorAll("[data-hint-index]")];
    const hintPanels = [...document.querySelectorAll("[data-hint-panel]")];
    hintPanels.forEach((panel, i) => {
      panel.innerHTML = question.hintsHtml?.[i] || question.hints[i] || "";
      panel.hidden = state.activeHintIndex !== i;
    });
    hintButtons.forEach((button, i) => {
      button.classList.toggle("is-open", state.activeHintIndex === i);
      button.setAttribute("aria-expanded", state.activeHintIndex === i ? "true" : "false");
      button.addEventListener("click", () => {
        const nextActive = state.activeHintIndex === i ? null : i;
        if (nextActive !== null && !state.usedHintCurrent) {
          state.usedHintCurrent = true;
          state.hintsUsedTotal += 1;
        }
        state.activeHintIndex = nextActive;
        hintPanels.forEach((panel, index) => { panel.hidden = nextActive !== index; });
        hintButtons.forEach((btn, index) => {
          const active = nextActive === index;
          btn.classList.toggle("is-open", active);
          btn.setAttribute("aria-expanded", active ? "true" : "false");
        });
      });
    });
  }

  function recordAnswer(question, correct) {
    stats.totalAnswered += 1;
    if (correct) stats.totalCorrect += 1;
    if (correct && isRareQuestion(question)) stats.rareCorrect += 1;
    if (state.mode === "streak" && correct) {
      stats.streakBest[state.level] = Math.max(stats.streakBest[state.level] || 0, state.streak);
    }
    saveStats();
    refreshAchievements();
  }

  function answerQuestion(selectedIndex) {
    const question = state.questions[state.index];
    const correct = selectedIndex === question.answer;
    state.selected = selectedIndex;

    if (state.mode === "streak") {
      if (correct) {
        state.streak += 1;
        stats.streakBest[state.level] = Math.max(stats.streakBest[state.level] || 0, state.streak);
      } else {
        state.streakEnded = true;
      }
      recordAnswer(question, correct);
      showAnswer();
      return;
    }

    if (correct) state.score += 1;
    recordAnswer(question, correct);
    showAnswer();
  }

  function renderPrediction(question) {
    const values = getPrediction(question);
    const holder = document.getElementById("predictionBars");
    const letters = ["A","B","C"];
    holder.replaceChildren();
    values.forEach((value, index) => {
      const row = document.createElement("div");
      row.className = "prediction-row";
      row.innerHTML = `<span class="prediction-letter" data-no-reading="true">${letters[index]}</span><div class="prediction-track"><div class="prediction-fill" style="width:${value}%"></div></div><strong data-no-reading="true">${value}%</strong>`;
      holder.appendChild(row);
    });
  }

  function showAnswer() {
    state.view = "answer";
    const question = state.questions[state.index];
    const isCorrect = state.selected === question.answer;
    app.replaceChildren(cloneTemplate(answerTemplate));

    const judgeText = document.getElementById("judgeText");
    judgeText.textContent = isCorrect ? "正解！" : "おしい！";
    judgeText.classList.add(isCorrect ? "judge-correct" : "judge-wrong");
    playSE(isCorrect ? "correct" : "wrong");
    if (isCorrect && state.mode === "streak" && state.streak >= 3) setTimeout(() => playSE("streak"), 170);

    if (isRareQuestion(question)) {
      const rare = document.getElementById("answerRareBadge");
      rare.hidden = false;
      rare.textContent = "✨ 超エウレーカ問題";
    }

    if (state.mode === "streak") {
      const celeb = document.getElementById("streakCelebration");
      celeb.hidden = false;
      if (isCorrect) {
        const tier = streakTier(state.streak);
        celeb.className = `streak-celebration streak-tier-${tier}`;
        celeb.innerHTML = `<span class="streak-big-number" data-no-reading="true">${state.streak}</span><strong>${state.streak === 1 ? "問正解！" : "問連続正解！"}</strong>`;
      } else {
        celeb.className = "streak-celebration streak-failed";
        celeb.innerHTML = `<strong>連続エウレーカ終了！</strong><span>記録 ${state.streak}問</span>`;
      }
    }

    attachVisual(document.getElementById("answerVisual"), question);
    bindFavoriteButton(document.getElementById("answerFavoriteButton"), question.id);
    bindUnknownButton(document.getElementById("unknownButton"), question.id);
    document.getElementById("shareButton").addEventListener("click", () => shareQuestion(question));

    document.getElementById("correctAnswer").innerHTML = question.choicesHtml?.[question.answer] || question.choices[question.answer];
    document.getElementById("yourAnswer").innerHTML = question.choicesHtml?.[state.selected] || question.choices[state.selected];
    document.getElementById("answerQuestion").innerHTML = question.questionHtml || question.question;
    document.getElementById("answerExplanation").innerHTML = question.explanationHtml || question.explanation;
    document.getElementById("answerTrivia").innerHTML = question.triviaHtml || question.trivia;
    document.getElementById("answerSource").textContent = question.source ? `出典・参考：${question.source}` : "";
    renderPrediction(question);

    const nextButton = document.getElementById("nextButton");
    if (state.mode === "streak") {
      nextButton.textContent = state.streakEnded ? "連続記録を見る" : "次の問題へ";
      nextButton.addEventListener("click", () => {
        if (state.streakEnded) showStreakResult();
        else getNextStreakQuestion();
      });
    } else {
      const isLast = state.index >= QUESTIONS_PER_GAME - 1;
      nextButton.textContent = isLast ? "結果を見る" : "次の問題へ";
      nextButton.addEventListener("click", () => {
        if (isLast) showResult();
        else {
          state.index += 1;
          state.selected = null;
          state.activeHintIndex = null;
          state.usedHintCurrent = false;
          showQuestion();
        }
      });
    }
  }

  function finalizeStandardStats() {
    if (state.resultFinalized) return;
    state.resultFinalized = true;
    if (state.score >= 3) stats.totalEureka = (stats.totalEureka || 0) + 1;
    if (state.mode === "normal" && state.level && LEVELS[state.level]) {
      if (state.score >= 3) stats.passes[state.level] += 1;
      if (state.score === 5) stats.perfect[state.level] += 1;
      if (state.level === "pro" && state.score === 5) stats.proPerfect += 1;
    }
    if (state.score === 5 && state.hintsUsedTotal === 0) stats.noHintPerfect += 1;
    if (state.mode === "daily") {
      const key = todayKey();
      stats.daily[key] = Math.max(stats.daily[key] ?? 0, state.score);
    }
    saveStats();
    refreshAchievements();
  }

  function showResult() {
    state.view = "result";
    finalizeStandardStats();
    app.replaceChildren(cloneTemplate(resultTemplate));
    document.getElementById("scoreValue").textContent = state.score;
    document.getElementById("resultModeText").textContent = currentModeLabel();

    const eurekaResult = document.getElementById("eurekaResult");
    let message = "";
    if (state.score >= 3) {
      eurekaResult.innerHTML = `<div class="eureka-burst" data-no-reading="true">!</div><div class="eureka-word">エウレーカ！</div><div class="eureka-pass">合格</div>`;
      eurekaResult.classList.add("is-pass");
      playSE("eureka");
      message = state.score === 5 ? "全問正解！見事なエウレーカです。" : "3問以上正解で合格！知識がひらめきにつながりました。";
    } else {
      eurekaResult.innerHTML = `<div class="retry-mark" data-no-reading="true">?</div><div class="retry-word">あと一歩！</div><div class="eureka-fail">不合格</div>`;
      eurekaResult.classList.add("is-fail");
      message = "3問正解で「エウレーカ！」。うんちくを読んで、もう一度挑戦してみましょう。";
    }
    document.getElementById("resultMessage").textContent = message;

    const unlockBox = document.getElementById("resultUnlocks");
    const unlocked = (state.pendingUnlocks || []).map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
    if (unlocked.length) {
      setTimeout(() => playSE("unlock"), 320);
      unlockBox.hidden = false;
      unlockBox.innerHTML = `<strong>🏆 新しい称号！</strong>${unlocked.map(a => `<span>${a.icon} ${a.name}</span>`).join("")}`;
    }

    const retry = document.getElementById("retryButton");
    if (state.mode === "normal") retry.addEventListener("click", () => startGame(state.level, "normal"));
    else if (state.mode === "daily") retry.addEventListener("click", startDaily);
    else retry.addEventListener("click", () => startCategory(state.categoryGroup));
    document.getElementById("topButton").addEventListener("click", showHome);
  }

    state.view = "streakResult";

    document.getElementById("streakFinalLevel").textContent = `${LEVELS[state.level].name} 最高記録：${stats.streakBest[state.level]}問`;

          <div class="dictionary-trivia-box"><strong>💡 うんちく</strong><p></p></div>
          <p class="dictionary-source"></p>
          <div class="dictionary-actions"><button class="mini-action unknown-mini" type="button"></button><button class="mini-action share-mini" type="button">📤 誰かに話す</button></div>`;
        attachVisual(card.querySelector('.topic-visual'), question);
        card.querySelector('.dictionary-question').innerHTML = question.questionHtml || question.question;
        card.querySelector('.dictionary-answerline strong').innerHTML = question.choicesHtml?.[question.answer] || question.choices[question.answer];
        card.querySelector('.dictionary-explanation').innerHTML = `答え：${question.explanationHtml || question.explanation}`;
        card.querySelector('.dictionary-trivia-box p').innerHTML = question.triviaHtml || question.trivia;
        card.querySelector('.dictionary-source').textContent = question.source ? `出典・参考：${question.source}` : '';
        bindFavoriteButton(card.querySelector('.favorite-button'), question.id, () => { if (kind === "favorite" && !isFavorite(question.id)) showDictionary(kind); });
        const unknownBtn = card.querySelector('.unknown-mini');
        updateUnknownButton(unknownBtn, question.id);
        unknownBtn.addEventListener('click', () => { toggleUnknown(question.id); if (kind === "unknown" && !unknownIds.includes(question.id)) showDictionary(kind); else updateUnknownButton(unknownBtn, question.id); });
        card.querySelector('.share-mini').addEventListener('click', () => shareQuestion(question));
        list.appendChild(card);
      });
    }
    document.getElementById('dictionaryTopButton').addEventListener('click', showHome);
  }

  function showTitles() {
    state.view = "titles";
    refreshAchievements();
    app.replaceChildren(cloneTemplate(titlesTemplate));
    document.getElementById("titlesCount").textContent = `${stats.unlocked.length} / ${ACHIEVEMENTS.length} 個獲得`;
    const grid = document.getElementById("titlesGrid");
    ACHIEVEMENTS.forEach(a => {
      const unlocked = stats.unlocked.includes(a.id);
      const card = document.createElement("div");
      card.className = `title-card ${unlocked ? "is-unlocked" : "is-locked"}`;
      card.innerHTML = `<span class="title-icon" data-no-reading="true">${unlocked ? a.icon : "🔒"}</span><strong>${a.name}</strong><small>${a.desc}</small>`;
      grid.appendChild(card);
    });
    document.getElementById("titlesTopButton").addEventListener("click", showHome);
  }

  async function installApp() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    showHome();
  }

  document.addEventListener('click', event => { if (event.target.closest('#homeLogo')) showHome(); });
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    const installCard = document.getElementById('installCard');
    if (installCard) installCard.hidden = false;
  });
  window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; });

  if (window.__ENABLE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(error => {
        console.warn('Service Worker registration failed:', error);
      });
    });
  }

  renderChrome();
  showHome();
})();</script>
</body>
</html>
